services:
  ##########
  # backend
  ##########
  backend:
    container_name: backend
    image: ft_trancendence/backend:v1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      ###
      # ./backend:/app : i added this to sync changes from backend folder into /app folder inside container
      ###
      - ./backend:/app
      ###
      # /app/node_module : to ignore local node_modules
      ##
      - /app/node_modules
      ###
      # ./database:/app/database: to prevent database from being removed hh i did that once
      ###
      - ./database:/app/database
    env_file:
      - .env
    restart: on-failure
    networks:
      - ft_trancendence

  #######
  # frontend
  #######
  frontend:
    container_name: frontend
    image: ft_trancendence/frontend:v1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    restart: on-failure
    networks:
      - ft_trancendence

networks:
  ft_trancendence:
    driver: bridge


